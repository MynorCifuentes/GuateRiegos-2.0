{% extends "base.html" %}
{% block title %}Estado de TDAs en t{% endblock %}
{% block content %}
<div class="container mt-4 bg-white p-4 rounded shadow">
    <h2 class="mb-3" style="color:#800000;">Gráfico de TDAs en tiempo t</h2>
    <form method="POST">
        <label for="tiempo_t"><b>Tiempo t (segundos):</b></label>
        <input type="number" name="tiempo_t" id="tiempo_t" min="1" value="{{ tiempo or 1 }}">
        <button type="submit" class="btn btn-info">Generar grafo</button>
    </form>
    {% if grafo_url %}
        <div class="mt-4">
            <img src="{{ grafo_url }}" alt="Grafo de TDAs" style="max-width:100%; border:1px solid #888;">
        </div>
    {% endif %}
    <a href="{{ url_for('simular', nombre_invernadero=nombre_invernadero, nombre_plan=nombre_plan) }}" class="btn btn-verde-oscuro mt-3">Regresar</a>
</div>
{% endblock %}
